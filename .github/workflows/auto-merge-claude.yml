# Claude が claude/ で始まる作業ブランチに push したら、自動で main に取り込む。
# これで「main に反映して」と毎回頼まなくても、GitHub Desktop で Pull するだけで最新になる。
name: Auto merge Claude branches into main

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main
